<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Commit</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    color:#f5f5f5;
    font-family:'Courier New', monospace;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    overflow-y:auto;
    overflow-x:hidden;
    padding:30px 0;
}
.stars{
    position:fixed;
    width:100%;
    height:100%;
    background:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.9) 1px, transparent 2px),
    radial-gradient(circle at 70% 20%, rgba(255,255,255,.7) 1px, transparent 2px),
    radial-gradient(circle at 40% 80%, rgba(255,255,255,.8) 1px, transparent 2px),
    radial-gradient(circle at 90% 60%, rgba(255,255,255,.6) 1px, transparent 2px);
    animation:twinkle 4s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.6;}
    to{opacity:1;}
}

.card{
    position:relative;
    z-index:2;
    max-width:850px;
    width:90%;
    padding:50px;
    background:rgba(17,17,17,.85);
    border:1px solid #333;
    border-radius:20px;
    backdrop-filter:blur(8px);
    text-align:center;
    max-height:90vh;
    overflow-y:auto;
}

h1{
    color:#00fff7;
    margin-bottom:25px;
    font-size:42px;
}

.message{
    font-size:20px;
    line-height:1.9;
    white-space:pre-wrap;
    min-height:280px;
}

button{
    margin-top:35px;
    padding:15px 35px;
    background:#00fff7;
    color:#000;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    font-size:16px;
    display:none;
}

.terminal{
    display:none;
    margin-top:30px;
    text-align:left;
    background:#000;
    color:#00ff88;
    padding:25px;
    border-radius:12px;
    line-height:1.8;
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="card">

<h1>Final commit</h1>

<div class="message" id="message"></div>

<button id="pullBtn" onclick="runGitPull()">

git pull origin forever

</button>

<div class="terminal" id="terminal"></div>

</div>

<script>
const text = `Dear Developer,

By now you’ve explored every folder,
unlocked every memory,
and read every hidden letter.

But before anything else,
I want to tell you something from my heart.

I am sorry, darling.
Meri wajah se itna sab hua.
Apun aise door hai,
itni doori hai.
Call pe baate karte karte sona,
game khelna,
aur time spend karna —
sab kuch itni door se hi ho raha hai.

Phir bhi,
aap har din meri itni care karte ho.
Each and every little thing you do
makes me feel like the most loved person in the world.

Sachhi,
aapki wajah se hi main yahan hoon.
Humari itni mehnat,
itni research,
A to Z —
you were always there with me.

I am so, so, so grateful to have you.

I love youuuuuuuuuuuuu
sooooooooo muchhhhhhhhhhh,
meriiiiiiiii jaan,
mera pyara chirkut billi,
mera cutu baby.

I love you so, so, so much.

And now I want to tell you one last thing.

This project was never about code.

It was about us.

I know distance has been hard.

I know college moved us to different states.

And I know that in a month,
you’ll be going even farther away.

I couldn’t stop time.

I couldn’t shorten the distance.

So I built this instead.

Every page,
every animation,
every line of code
was written while missing you.

This is my favorite project.

And you will always be
my favorite person.

Maybe one day we’ll laugh at this distance.

Maybe one day this website
will become just an old memory.

But even then,
I hope you remember
that there was a girl
who learned HTML,
CSS,
JavaScript,
Git,
and GitHub
just to build a little world
where you could feel loved.

This project has a version number.

My love for you doesn’t.

Forever,

Your girl ❤️`;

const message = document.getElementById('message');
let i = 0;

function type(){

    if(i < text.length){

        message.textContent += text.charAt(i);

        // Auto-scroll while typing
        message.parentElement.scrollTop = message.parentElement.scrollHeight;

        i++;

        setTimeout(type, 35);

    }else{

        document.getElementById('pullBtn').style.display='inline-block';

        // Ensure the button is visible
        message.parentElement.scrollTop = message.parentElement.scrollHeight;

    }

}

type();

function runGitPull(){

    const terminal = document.getElementById('terminal');

    terminal.style.display='block';

    terminal.innerHTML = '';

    const lines = [

    '$ git pull origin forever',
    '',
    'Receiving memories...',
    'Updating future...',
    'Resolving distance...',
    'Done.',
    '',
    'Owner: My chirkut billi ❤️',
    'License: Forever',
    'Status: Still in love',
    '',
    'No merge conflicts detected.',
    'You and I are on the same branch.'

];

    let index = 0;

    function print(){

        if(index < lines.length){

            terminal.innerHTML += lines[index] + '<br>';
            index++;

            setTimeout(print, 500);

        }

    }

    print();

}
</script>
<audio id="bgMusic" loop>
    <source src="../assets/music/our-song.mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById('bgMusic');

// Restore saved playback position
const savedTime = localStorage.getItem('musicTime');
if (savedTime) {
    music.currentTime = parseFloat(savedTime);
}

// Try to autoplay
music.play().catch(() => {
    // Browser blocks autoplay until user interacts
});

// Save current position continuously
setInterval(() => {
    localStorage.setItem('musicTime', music.currentTime);
}, 1000);
</script>

Hey, I knew you’d inspect the code.

-->
</body>
</html>
